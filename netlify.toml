[build]
command = "npm run build"
publish = "dist"
[build.environment]
NODE_VERSION = "22"
[functions]
directory = "netlify/functions"
[[redirects]]
from = "/sitemap.xml"
to = "/.netlify/functions/sitemap"
status = 200
[[redirects]]
from = "/"
to = "/.netlify/functions/page"
status = 200
force = true
[[redirects]]
from = "/journal/:slug"
to = "/.netlify/functions/page?kind=posts&slug=:slug"
status = 200
[[redirects]]
from = "/work/:slug"
to = "/.netlify/functions/page?kind=projects&slug=:slug"
status = 200
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
